# =============================================================================
# Starship Prompt Configuration
#
# Projekt : Terminal Environment
# Version : 0.1.0
#
# Beschreibung:
# Grundkonfiguration des Starship-Prompts.
# Zusätzliche Module werden schrittweise ergänzt.
# =============================================================================

add_newline = true

format = """
$username\
$hostname\

$directory\

$character
"""
[character]
success_symbol = "[❯](bold cyan)"
error_symbol = "[❯](bold red)"
vicmd_symbol = "[❮](bold yellow)"

[username]
show_always = true
style_user = "bold blue"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bold cyan"
format = "@[$hostname]($style)"

[directory]
style = "bold yellow"
truncate_to_repo = false
truncation_length = 0

[git_branch]
symbol = " "
style = "bold green"

[git_status]
style = "bold red"

[cmd_duration]
min_time = 100
style = "bold magenta"


